apiVersion: argoproj.io/v1alpha1
kind: Application

metadata:
  name: python-backend-application
  namespace: argocd

spec:
  project: default

  source:
    repoURL: https://github.com/btv1812-afk/python-backend.git
    targetRevision: main
    path: k8s

  destination:
    namespace: python-backend
    server: https://kubernetes.default.svc

  syncPolicy:
    automated:
      prune: true
      selfHeal: true


    syncOptions:
    - CreateNamespace=true